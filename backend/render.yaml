services:
  - type: web
    name: e-setu-bridge
    env: node
    plan: free
    region: oregon
    buildCommand: echo "Installing dependencies and preparing E-Setu..."
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
